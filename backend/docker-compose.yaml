services:
  postgres:
    image: postgres:16
    container_name: postgres_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: haslo123
      POSTGRES_DB: moja_baza
    ports:
      - "5432:5432"
    volumes:
      -  postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  pgadmin_data:
